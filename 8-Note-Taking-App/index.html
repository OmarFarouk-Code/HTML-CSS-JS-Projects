<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note Taking App</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <!-- Mobile top bar (hidden on desktop) -->
    <header class="topbar">
      <button class="topbar__menu" type="button" aria-label="Open menu" aria-expanded="false">
        <svg width="20" height="15" viewBox="0 0 20 15" aria-hidden="true">
          <path d="M0 1h20M0 7.5h20M0 14h20" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </button>
      <a class="topbar__logo" href="#">Almdrasa-Notes</a>
    </header>

    <aside class="sidebar">
      <button class="sidebar__close" type="button" aria-label="Close menu">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M1 1l14 14M15 1L1 15" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </button>

      <a class="sidebar__logo" href="#">Almdrasa-Notes</a>

      <form class="sidebar__search search" role="search">
        <label class="search__label" for="search-input">Search</label>
        <img class="search__icon" src="assets/search-icon.svg" alt="" />
        <input class="search__input" id="search-input" type="search" placeholder="Search" />
      </form>

      <nav class="sidebar__nav menu">
        <ul class="menu__list">
          <li class="menu__item menu__item--active" data-item="notes">
            <a class="menu__link" href="#notes">Notes</a>
          </li>
          <li class="menu__item" data-item="add-notes">
            <a class="menu__link" href="#add-note">Add Note</a>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- Dark layer behind the open menu on mobile. Must stay right after .sidebar -->
    <div class="overlay"></div>

    <section class="archive">
      <div class="archive__section">
        <h2 class="archive__heading">Pinned</h2>

        <ul class="archive__list"></ul>
      </div>

      <div class="archive__section">
        <h2 class="archive__heading archive__heading--divided">Notes</h2>

        <ul class="archive__list"></ul>
      </div>

      <a class="archive__more button" href="#all-posts">All Notes</a>
    </section>

    <main class="content">
      <a class="button button--round" href="#add-note" aria-label="Add note">
        <img class="button__icon" src="assets/add-note-icon.svg" alt="" />
      </a>

      <!-- View 1: note details (default) -->
      <div class="note-view-container"></div>

      <!-- View 2: add note form (shown when the URL ends with #add-note) -->
      <section class="add-note" id="add-note">
        <h1 class="add-note__title">Add Note</h1>

        <form class="add-note__form" id="add-note-form">
          <div class="form-field">
            <label class="form-field__label" for="note-title">Title<span aria-hidden="true">*</span></label>
            <input class="form-field__input" id="note-title" name="title" type="text" required />
            <p class="form-field__error-message hidden">Fill in the field above</p>
          </div>

          <div class="form-field">
            <label class="form-field__label" for="note-author">Author<span aria-hidden="true">*</span></label>
            <input class="form-field__input" id="note-author" name="author" type="text" required />
            <p class="form-field__error-message hidden">Fill in the field above</p>
          </div>

          <div class="form-field">
            <label class="form-field__label" for="note-text">Your Note<span aria-hidden="true">*</span></label>
            <textarea class="form-field__input form-field__input--textarea" id="note-text" name="text" required></textarea>
            <p class="form-field__error-message hidden">Fill in the field above</p>
          </div>

          <div class="add-note__actions">
            <button class="button" type="submit">Add Note</button>
            <button class="button" type="submit" name="pinned" value="true">Add pinned note</button>
          </div>
        </form>
      </section>
    </main>

    <script src="./scripts/index.js" type="module"></script>
  </body>
</html>
